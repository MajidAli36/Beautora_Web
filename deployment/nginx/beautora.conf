# Beautora — Nginx reverse proxy (Contabo)
# Placeholders: replace YOUR_DOMAIN with the real hostname (e.g. www.beautora.app)
# before enabling this site. Keep apex (beautora.app) as a separate server block
# that redirects to www if that is your canonical host.
#
# Install (Ubuntu):
#   sudo cp deployment/nginx/beautora.conf /etc/nginx/sites-available/beautora
#   # edit YOUR_DOMAIN, then:
#   sudo ln -sf /etc/nginx/sites-available/beautora /etc/nginx/sites-enabled/beautora
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN
#
# Upstream: Docker Compose binds Next.js to 127.0.0.1:3000

upstream beautora_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # Managed by Certbot (paths appear after first successful issue)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (complement Next.js headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enable HSTS only after HTTPS is confirmed working:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25m;
    client_body_timeout 120s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Gzip for text-ish responses (Next already compresses some assets)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://beautora_next;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / HMR-compatible upgrade headers (safe for production too)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    # Optional: longer timeout for Server Actions / large uploads
    location ~* ^/(api|.*action.*) {
        proxy_pass http://beautora_next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 180s;
        client_max_body_size 25m;
    }
}

